name: BDPM Auto Update

on:
  schedule:
    - cron: "0 * * * *"  # check toutes les heures (léger car HEAD only)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y jq

      # 🧠 1. CHECK ULTRA RAPIDE (ETag)
      - name: Check remote BDPM version
        id: check
        run: |
          URL="URL_BDPM_ICI"

          echo "Checking remote ETag..."

          ETAG=$(curl -sI "$URL" | grep -i etag | cut -d: -f2 | tr -d ' \r"')

          echo "Remote ETAG: $ETAG"

          if [ -f data/.bdpm_meta.json ]; then
            OLD_ETAG=$(jq -r .etag data/.bdpm_meta.json)
          else
            OLD_ETAG=""
          fi

          echo "Local ETAG: $OLD_ETAG"

          if [ "$ETAG" = "$OLD_ETAG" ] && [ -f data/bdpm.db ]; then
            echo "updated=false" >> $GITHUB_OUTPUT
            echo "No update detected → stopping workflow."
            exit 0
          fi

          echo "updated=true" >> $GITHUB_OUTPUT
          echo "New update detected → continuing."

          echo "{\"etag\": \"$ETAG\"}" > data/.new_meta.json

      # 🧱 2. BUILD UNIQUEMENT SI UPDATE
      - name: Update BDPM
        if: steps.check.outputs.updated == 'true'
        run: |
          python update_bdpm.py

      # 💾 3. COMMIT UNIQUEMENT SI CHANGEMENT
      - name: Commit database
        if: steps.check.outputs.updated == 'true'
        run: |
          git config user.name github-actions
          git config user.email actions@github.com

          git add data/bdpm.db
          git add data/.bdpm_meta.json

          git commit -m "BDPM auto update" || exit 0
          git push